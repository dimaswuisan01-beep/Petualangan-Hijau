    <script>
      (function() {
        // Ensure window.fetch has both getter and setter so browser extensions and interceptors can assign to it safely
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if property cannot be redefined
        }

        // Prevent external chrome-extension errors from polluting app lifecycle
        window.addEventListener('error', function(event) {
          if (
            event &&
            (
              (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            )
          ) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            typeof event.reason.message === 'string' &&
            event.reason.message.indexOf('Cannot set property fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
          }
        }, true);
      })();
    </script>
